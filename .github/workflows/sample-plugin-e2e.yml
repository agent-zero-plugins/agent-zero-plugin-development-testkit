# Devkit self-test: run the full lifecycle against the bundled sample plugin on
# a GitHub runner. Self-contained (the devkit IS the devkit here — no submodule,
# no App token), so it exercises the HARNESS. The consumer DISTRIBUTION path
# (devkit submodule + App-token + reusable plugin-e2e.yml) is exercised by
# onboarding a real plugin repo (e.g. livekit).
name: sample-plugin-e2e

on:
  push:
    branches: ["main", "feat/devkit-sync-distribution"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  sample-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        # The fork image (ghcr.io/nuevanext/agent-zero, bundles ML deps e.g.
        # onnxruntime) is larger than upstream's 8.76GB and exhausts the runner
        # disk during the nested unpack. Reclaim ~30GB of preinstalled tooling.
        run: |
          df -h / | tail -1
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup \
                      /usr/local/lib/android /opt/hostedtoolcache/CodeQL \
                      /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" 2>/dev/null || true
          sudo docker image prune -af 2>/dev/null || true
          echo "after reclaim:"; df -h / | tail -1

      - name: Build devcontainer (rootless)
        run: podman build -t plugin-devkit:ci -f devcontainer/Containerfile devcontainer

      - name: Package sample + run lifecycle (A0 nested, unprivileged)
        # Validates DEC-055 fork-first: boots the PRIVATE non-root fork image
        # (ghcr.io/nuevanext/agent-zero:latest-nonroot) via the harness ghcr login.
        env:
          GHCR_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p dist
          ( cd examples/sample-plugin && zip -qr "$GITHUB_WORKSPACE/dist/sample_plugin.zip" . -x 'tests/*' )
          podman run --rm \
            --device /dev/fuse \
            --security-opt label=disable \
            --sysctl net.ipv4.ip_unprivileged_port_start=0 \
            -v "$GITHUB_WORKSPACE":/workspace:ro \
            -v "$GITHUB_WORKSPACE/dist/sample_plugin.zip":/tmp/plugin.zip:ro \
            -e PLUGIN_ZIP=/tmp/plugin.zip \
            -e PLUGIN_DISPLAY_NAME="Sample Plugin" \
            -e PLUGIN_NAME=sample_plugin \
            -e HOOK_DIR=/workspace/examples/sample-plugin/tests/e2e/hooks \
            -e BEHAVIOUR_FILE=/workspace/examples/sample-plugin/tests/e2e/behaviour.mjs \
            -e A0_IMAGE="ghcr.io/nuevanext/agent-zero:latest-nonroot" \
            -e GHCR_USER=x \
            -e GHCR_TOKEN="$GHCR_TOKEN" \
            plugin-devkit:ci \
            -lc 'bash /workspace/e2e/harness/run-lifecycle.sh'
