# Reusable plugin-e2e workflow (SPEC DEC-020/044).
#
# A consumer plugin repo invokes it via a thin, parameter-free caller
# (templates/plugin-e2e.caller.yml, copied in by `make link-workflows`). It:
#   1. mints the sync-App token (to clone the private devkit submodule),
#   2. checks out the consumer + inits its devkit submodule (tests/_testkit),
#   3. resolves the plugin (.devkit.yml `plugin_dir` → else usr/plugins/<name>,
#      per DEC-042/043),
#   4. builds the devkit devcontainer, packages the plugin, and runs the full
#      install → verify-installed → uninstall → verify-uninstalled lifecycle
#      with A0 booted NESTED + rootless (Phase-0 model).
name: plugin-e2e

on:
  workflow_call:
    inputs:
      a0_image:
        description: "A0 image under test (overridden by .devkit.yml a0_image)."
        required: false
        type: string
        default: "ghcr.io/nuevanext/agent-zero:latest-nonroot"
      devkit-submodule-path:
        description: "Path to the vendored devkit submodule."
        required: false
        type: string
        default: "tests/_testkit"
    secrets:
      SKILLS_SYNC_APP_CLIENT_ID:
        description: "Sync App OAuth Client ID (to clone the private devkit)."
        required: true
      SKILLS_SYNC_APP_PRIVATE_KEY:
        description: "Sync App private-key PEM."
        required: true
      GHCR_PULL_TOKEN:
        description: "ghcr read:packages token to pull the private fork image (DEC-055). Optional — without it the e2e runs on the public default image."
        required: false

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Mint App token (read-only — devkit submodule clone)
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1  # v3.2.0
        with:
          client-id: ${{ secrets.SKILLS_SYNC_APP_CLIENT_ID }}
          private-key: ${{ secrets.SKILLS_SYNC_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Checkout consumer (GITHUB_TOKEN, no submodules)
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          submodules: false

      - name: Init devkit submodule (App token)
        env:
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
          DEVKIT_PATH: ${{ inputs.devkit-submodule-path }}
        run: |
          AUTH=$(printf 'x-access-token:%s' "$APP_TOKEN" | base64 -w0)
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $AUTH" \
            submodule update --init "$DEVKIT_PATH"

      - name: Build plugin (optional — .devkit.yml `build:`)
        # Build-generated plugins (e.g. a vendored upstream compiled into a
        # plugin dir) declare a `build:` command in .devkit.yml. It runs on the
        # runner (python3/make/git/zip available) BEFORE resolve+package, and is
        # responsible for initialising any of its OWN (public) submodules it
        # needs — e.g. `git submodule update --init upstream && make build`.
        # Absent `build:` → no-op, so this step is transparent to the fleet.
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          build=$(sed -nE 's/^build:[[:space:]]*"?([^"]+)"?.*/\1/p' .devkit.yml 2>/dev/null | head -1)
          if [ -n "$build" ]; then
            echo "::group::build: $build"
            bash -euo pipefail -c "$build"
            echo "::endgroup::"
          else
            echo "no .devkit.yml build: step — skipping"
          fi

      - name: Resolve plugin (.devkit.yml → else usr/plugins/<name>)
        id: resolve
        env:
          INPUT_A0_IMAGE: ${{ inputs.a0_image }}
        run: |
          set -euo pipefail
          y(){ sed -nE "s/^$1:[[:space:]]*\"?([^\"]+)\"?.*/\1/p" "$2" 2>/dev/null | head -1; }
          plugin_dir="" display_name="" cfg_a0=""
          if [ -f .devkit.yml ]; then
            plugin_dir=$(y plugin_dir .devkit.yml)
            display_name=$(y display_name .devkit.yml)
            cfg_a0=$(y a0_image .devkit.yml)
          fi
          if [ -z "$plugin_dir" ]; then
            plugin_dir=$(dirname "$(find usr/plugins -maxdepth 2 -name plugin.yaml 2>/dev/null | head -1)")
          fi
          [ -d "$plugin_dir" ] && [ -f "$plugin_dir/plugin.yaml" ] || {
            echo "::error::could not resolve plugin_dir (set .devkit.yml plugin_dir or use usr/plugins/<name>/)"; exit 1; }
          plugin_name=$(y name "$plugin_dir/plugin.yaml")
          [ -n "$display_name" ] || display_name=$(y title "$plugin_dir/plugin.yaml")
          [ -n "$display_name" ] || display_name="$plugin_name"
          a0_image="${cfg_a0:-$INPUT_A0_IMAGE}"
          # Optional plugin-declared nested-A0 env (DEC-057). Natural YAML map:
          #   e2e_pod_env:
          #     A0_FOO_TEST_PROBE: "1"
          # flattened to a space-separated KEY=VAL list the harness forwards as
          # `-e KEY=VAL` into the nested A0 pod. Enables env-gated test seams for
          # e2e ONLY (the seam stays off in prod). Also accepts an inline scalar
          # `e2e_pod_env: "A=1 B=2"`.
          pod_env=""
          if [ -f .devkit.yml ]; then
            pod_env=$(y e2e_pod_env .devkit.yml)
            if [ -z "$pod_env" ]; then
              pod_env=$(awk '
                /^e2e_pod_env:[[:space:]]*$/ {inblk=1; next}
                inblk && /^[[:space:]]+[A-Za-z_][A-Za-z0-9_]*:/ {
                  l=$0; sub(/^[[:space:]]+/,"",l)
                  k=l; sub(/:.*/,"",k)
                  v=l; sub(/^[^:]*:[[:space:]]*/,"",v); gsub(/^["'\'']|["'\'']$/,"",v)
                  printf "%s=%s ", k, v; next }
                inblk && /^[^[:space:]]/ {inblk=0}
              ' .devkit.yml)
            fi
          fi
          echo "plugin_dir=$plugin_dir"       >> "$GITHUB_OUTPUT"
          echo "plugin_name=$plugin_name"     >> "$GITHUB_OUTPUT"
          echo "display_name=$display_name"   >> "$GITHUB_OUTPUT"
          echo "a0_image=$a0_image"           >> "$GITHUB_OUTPUT"
          echo "pod_env=$pod_env"             >> "$GITHUB_OUTPUT"
          echo "Resolved: dir=$plugin_dir name=$plugin_name display='$display_name' a0=$a0_image pod_env='$pod_env'"

      - name: Free disk space
        # The fork image (ghcr.io/nuevanext/agent-zero, bundles ML deps e.g.
        # onnxruntime) is larger than upstream's 8.76GB and exhausts the runner
        # disk during the nested unpack. Reclaim ~30GB of preinstalled tooling.
        run: |
          df -h / | tail -1
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup \
                      /usr/local/lib/android /opt/hostedtoolcache/CodeQL \
                      /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" 2>/dev/null || true
          sudo docker image prune -af 2>/dev/null || true
          echo "after reclaim:"; df -h / | tail -1

      - name: Tier-1 BDD lint (DEC-066, hard-fail)
        # Behaviour-first honesty/purity/traceability gates + REQUIRES BDD tests:
        # a plugin with no tests/e2e/features/ hard-fails (no exceptions). Runs before
        # the expensive build so a standard violation fails fast — the gate humans +
        # agents can't lazy past.
        env:
          DEVKIT_PATH: ${{ inputs.devkit-submodule-path }}
          PLUGIN_DIR: ${{ steps.resolve.outputs.plugin_dir }}
        run: python3 "$DEVKIT_PATH/e2e/lint/bdd_lint.py" "$PLUGIN_DIR"

      - name: Build devkit devcontainer (rootless)
        env:
          DEVKIT_PATH: ${{ inputs.devkit-submodule-path }}
        run: podman build -t plugin-devkit:ci -f "$DEVKIT_PATH/devcontainer/Containerfile" "$DEVKIT_PATH/devcontainer"

      - name: Package + run lifecycle (A0 nested, unprivileged)
        env:
          DEVKIT_PATH: ${{ inputs.devkit-submodule-path }}
          PLUGIN_DIR: ${{ steps.resolve.outputs.plugin_dir }}
          PLUGIN_NAME: ${{ steps.resolve.outputs.plugin_name }}
          DISPLAY_NAME: ${{ steps.resolve.outputs.display_name }}
          A0_IMAGE: ${{ steps.resolve.outputs.a0_image }}
          A0_POD_ENV: ${{ steps.resolve.outputs.pod_env }}
          GHCR_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p dist "$GITHUB_WORKSPACE/artifacts"
          chmod 777 "$GITHUB_WORKSPACE/artifacts"   # rootless-podman maps the container user to a subuid; 777 lets it write
          # Exclude the standardization wrapper + repo meta so root-layout
          # plugins (.devkit.yml plugin_dir: .) don't pack .git, the devkit
          # submodule (tests/_testkit), caller workflows, etc. into the zip.
          # No-ops for subdir layouts (those dirs aren't inside PLUGIN_DIR).
          ( cd "$PLUGIN_DIR" && zip -qr "$GITHUB_WORKSPACE/dist/$PLUGIN_NAME.zip" . \
              -x '.git/*' 'tests/*' '.github/*' '.skills/*' 'dist/*' '*/node_modules/*' \
                 '.devkit.yml' '.gitmodules' '.gitignore' )
          HOOK_DIR_REL="tests/e2e/hooks"
          # Behaviour seam (DEC-053/056). Prefer ≤10 grouped specs under
          # tests/e2e/specs/*.mjs (each runs as its own test → its own video);
          # fall back to a single tests/e2e/behaviour.mjs. Absent ⇒ spec logs the gap.
          BEHAVIOUR_REL="tests/e2e/behaviour.mjs"
          if [ -f "$BEHAVIOUR_REL" ]; then BEHAVIOUR_ARG="/workspace/$BEHAVIOUR_REL"; else BEHAVIOUR_ARG=""; fi
          SPECS_JSON="[]"
          if ls tests/e2e/specs/*.mjs >/dev/null 2>&1; then
            SPECS_JSON=$(for f in tests/e2e/specs/*.mjs; do
              n=$(basename "$f" .mjs); printf '{"name":"%s","path":"/workspace/%s"}\n' "$n" "$f"; done \
              | paste -sd, - | sed 's/^/[/; s/$/]/')
          fi
          # Cycle-3 (DEC-063): if the plugin ships BDD features, run the
          # playwright-bdd harness; otherwise the classic .mjs lifecycle.
          HARNESS=run-lifecycle.sh
          if ls tests/e2e/features/*.feature >/dev/null 2>&1; then HARNESS=run-bdd.sh; fi
          echo "harness: $HARNESS"
          podman run --rm \
            --device /dev/fuse \
            --security-opt label=disable \
            --sysctl net.ipv4.ip_unprivileged_port_start=0 \
            -v "$GITHUB_WORKSPACE":/workspace:ro \
            -v "$GITHUB_WORKSPACE/dist/$PLUGIN_NAME.zip":/tmp/plugin.zip:ro \
            -v "$GITHUB_WORKSPACE/artifacts":/artifacts:rw \
            -e A0_IMAGE="$A0_IMAGE" \
            -e GHCR_USER=x \
            -e GHCR_TOKEN="$GHCR_TOKEN" \
            -e PLUGIN_ZIP=/tmp/plugin.zip \
            -e PLUGIN_DISPLAY_NAME="$DISPLAY_NAME" \
            -e PLUGIN_NAME="$PLUGIN_NAME" \
            -e HOOK_DIR="/workspace/$HOOK_DIR_REL" \
            -e BEHAVIOUR_FILE="$BEHAVIOUR_ARG" \
            -e BEHAVIOUR_SPECS="$SPECS_JSON" \
            -e A0_POD_ENV="$A0_POD_ENV" \
            -e ARTIFACT_DIR=/artifacts \
            -e WORKSPACE=/workspace \
            -e DEVKIT_PATH="$DEVKIT_PATH" \
            plugin-devkit:ci \
            -lc 'bash /workspace/'"$DEVKIT_PATH"'/e2e/harness/'"$HARNESS"

      - name: Convert lifecycle video → GIF + upload recording artifact
        if: always()
        env:
          PLUGIN_NAME: ${{ steps.resolve.outputs.plugin_name }}
        run: |
          set -uo pipefail
          shopt -s nullglob
          sudo chown -R "$USER" artifacts 2>/dev/null || true
          if ! command -v ffmpeg >/dev/null 2>&1; then sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg; fi
          for webm in artifacts/*.webm; do
            base="${webm%.webm}"
            ffmpeg -y -i "$webm" -vf "fps=6,scale=1024:-1:flags=lanczos,palettegen" /tmp/pal.png 2>/dev/null || continue
            ffmpeg -y -i "$webm" -i /tmp/pal.png -lavfi "fps=6,scale=1024:-1:flags=lanczos[x];[x][1:v]paletteuse" "$base.gif" 2>/dev/null || true
            echo "GIF: $base.gif ($(du -h "$base.gif" 2>/dev/null | cut -f1))"
          done
          ls -la artifacts/ || true

      - name: Upload e2e recording
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-recording-${{ steps.resolve.outputs.plugin_name }}
          path: artifacts/
          if-no-files-found: warn
          retention-days: 30

  merge-guard:
    # Free private repos can't use required status checks (paid feature), so block
    # the merge button the only free way: convert the PR to draft when plugin-e2e
    # is red, mark it ready when green. A deterrent + signal — the publish gate
    # (DEC-066 Tier-2) is the hard block on *shipping*; a maintainer can still
    # re-ready a draft, so this is PR-level friction, not a lock.
    needs: e2e
    if: always() && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Draft on red / ready on green
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          RESULT: ${{ needs.e2e.result }}
        run: |
          if [ "$RESULT" = "success" ]; then
            gh pr ready "$PR" --repo "$REPO" || true
            echo "plugin-e2e green → PR #$PR marked ready."
          else
            gh pr ready "$PR" --repo "$REPO" --undo || true
            gh pr comment "$PR" --repo "$REPO" --body "🚫 **Merge blocked** — \`plugin-e2e\` concluded **$RESULT**, so this PR was converted to draft. Fix the gates (see \`tests/_testkit/docs/BDD-GATES.md\`); a green run marks it ready again. The publish gate also blocks shipping until green." || true
            echo "plugin-e2e $RESULT → PR #$PR converted to draft (merge blocked)."
          fi
